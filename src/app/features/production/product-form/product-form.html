<div class="max-w-2xl mx-auto space-y-6">
  
  <div>
    <h2 class="text-2xl font-bold text-slate-800">
      {{ isEditMode() ? 'Edit Product' : 'New Product' }}
    </h2>
    <p class="text-slate-500">Define a finished good to manufacture.</p>
  </div>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-600 p-4 rounded-lg border border-red-200">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
    
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Product Name</label>
      <input type="text" formControlName="name" placeholder="e.g. Office Desk"
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Unit Cost ($)</label>
        <input type="number" formControlName="cost" step="0.01" 
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Initial Stock</label>
        <input type="number" formControlName="stock" 
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Production Time (minutes)</label>
      <input type="number" formControlName="productionTime" 
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <p class="text-xs text-slate-400 mt-1">Estimated time to manufacture one unit.</p>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
      <a routerLink="/production/products" 
         class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition cursor-pointer">
        Cancel
      </a>
      <button type="submit" 
              [disabled]="form.invalid || isSubmitting()"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition disabled:opacity-50">
        {{ isEditMode() ? 'Update Product' : 'Create Product' }}
      </button>
    </div>

  </form>
</div>
