<div class="max-w-2xl mx-auto space-y-6">
  
  <div>
    <h2 class="text-2xl font-bold text-slate-800">
      {{ isEditMode() ? 'Edit Order' : 'New Production Order' }}
    </h2>
    <p class="text-slate-500">Plan a new manufacturing batch.</p>
  </div>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-600 p-4 rounded-lg border border-red-200">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
    
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Product</label>
      <p class="text-xs text-slate-400 mb-2">Select the item to manufacture.</p>
      
      <select formControlName="productId" 
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
        
        <option [ngValue]="null">Select a product...</option>
        
        @for (product of availableProducts(); track product.id) {
          <option [value]="product.id">
            {{ product.name }} (Stock: {{ product.stock }})
          </option>
        }

        @if (availableProducts().length === 0) {
          <option disabled>No products found. Create one first!</option>
        }
      </select>

      @if (form.get('productId')?.invalid && form.get('productId')?.touched) {
        <p class="text-red-500 text-xs mt-1">Please select a product.</p>
      }
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Quantity</label>
      <input type="number" formControlName="quantity" 
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
             [class.border-red-500]="form.get('quantity')?.invalid && form.get('quantity')?.touched">
    </div>

    <div class="grid grid-cols-2 gap-6 opacity-50 cursor-not-allowed">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Start Date (Auto)</label>
        <input type="date" formControlName="startDate" readonly
               class="w-full px-4 py-2 border rounded-lg bg-slate-50 outline-none pointer-events-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Status (Auto)</label>
        <input type="text" value="PENDING" readonly
               class="w-full px-4 py-2 border rounded-lg bg-slate-50 outline-none pointer-events-none">
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
      <a routerLink="/production/orders" 
         class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition cursor-pointer">
        Cancel
      </a>
      <button type="submit" 
              [disabled]="form.invalid || isSubmitting()"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        @if (isSubmitting()) {
          <span>Saving...</span>
        } @else {
          <span>{{ isEditMode() ? 'Update Order' : 'Create Order' }}</span>
        }
      </button>
    </div>

  </form>
</div>
