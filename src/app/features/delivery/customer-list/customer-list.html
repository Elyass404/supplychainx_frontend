<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-slate-800">Customers</h2>
    <a routerLink="/delivery/customers/new" 
       class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
      + Add Customer
    </a>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
        <tr>
          <th class="p-4">Name</th>
          <th class="p-4">City</th>
          <th class="p-4">Address</th>
          <th class="p-4 text-center">Active Orders</th>
          <th class="p-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
        @for (c of customers(); track c.id) {
          <tr class="hover:bg-slate-50">
            <td class="p-4 font-medium">{{ c.name }}</td>
            <td class="p-4">{{ c.city }}</td>
            <td class="p-4 text-slate-500 truncate max-w-xs">{{ c.address }}</td>
            
            <td class="p-4 text-center">
              @if(c.activeOrderCount > 0) {
                <span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-bold">
                  {{ c.activeOrderCount }} Active
                </span>
              } @else {
                <span class="text-slate-400">-</span>
              }
            </td>

            <td class="p-4 text-right space-x-3">
              <a [routerLink]="['/delivery/customers', c.id, 'edit']" 
                 class="text-blue-600 hover:underline">Edit</a>
              
              <button (click)="onDelete(c)" 
                      [disabled]="c.activeOrderCount > 0"
                      class="text-red-600 hover:underline disabled:opacity-30 disabled:cursor-not-allowed"
                      title="Cannot delete if active orders exist">
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
